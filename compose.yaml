services:
  db-init:
    build:
      context: .
      target: builder
    environment:
      TASK3_DATABASE_DIRECTORY: /app/data
      DATABASE_URL: file:/app/data/sitecost.db
    volumes:
      - sitecost_data:/app/data
    command:
      - sh
      - -lc
      - pnpm db:push && pnpm db:seed && chown -R 1001:1001 /app/data
    restart: "no"

  app:
    build:
      context: .
      target: runner
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${SITECOST_HOST_PORT:-3000}:3000"
    environment:
      TASK3_DATABASE_DIRECTORY: /app/data
      DATABASE_URL: file:/app/data/sitecost.db
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-docker-local-change-me}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      SITECOST_AUTH_PROVIDER: ${SITECOST_AUTH_PROVIDER:-legacy}
      SITECOST_SUPABASE_URL: ${SITECOST_SUPABASE_URL:-https://erweztmbezbwbjzwjxqt.supabase.co}
      SITECOST_SUPABASE_PUBLISHABLE_KEY: ${SITECOST_SUPABASE_PUBLISHABLE_KEY:-}
      SITECOST_PROJECT_CONTEXT_API_URL: ${SITECOST_PROJECT_CONTEXT_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/sitecost-project-context-api}
      DRYING_YARD_ADMIN_API_URL: ${DRYING_YARD_ADMIN_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-admin-api}
      DRYING_YARD_ADMIN_USERNAME: ${DRYING_YARD_ADMIN_USERNAME:-}
      DRYING_YARD_ADMIN_PASSWORD: ${DRYING_YARD_ADMIN_PASSWORD:-}
      DRYING_YARD_ADMIN_ACCESS_CODE: ${DRYING_YARD_ADMIN_ACCESS_CODE:-}
      DRYING_YARD_COMMERCIAL_API_URL: ${DRYING_YARD_COMMERCIAL_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-commercial-api}
      DRYING_YARD_PM_API_URL: ${DRYING_YARD_PM_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-pm-api}
      DRYING_YARD_SUPPLIER_API_URL: ${DRYING_YARD_SUPPLIER_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-supplier-api}
      DRYING_YARD_PM_GUARDRAIL_API_URL: ${DRYING_YARD_PM_GUARDRAIL_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-pm-guardrail-api}
      DRYING_YARD_AWARD_API_URL: ${DRYING_YARD_AWARD_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-award-api}
      DRYING_YARD_BATCH_API_URL: ${DRYING_YARD_BATCH_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-batch-api}
      DRYING_YARD_READINESS_API_URL: ${DRYING_YARD_READINESS_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-readiness-api}
      DRYING_YARD_DELIVERY_API_URL: ${DRYING_YARD_DELIVERY_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-delivery-api}
      DRYING_YARD_INVOICE_API_URL: ${DRYING_YARD_INVOICE_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-invoice-api}
      DRYING_YARD_PROPOSAL_LINK_API_URL: ${DRYING_YARD_PROPOSAL_LINK_API_URL:-https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-proposal-link-api}
      NEXT_PUBLIC_DRYING_YARD_TEAM_URL: ${NEXT_PUBLIC_DRYING_YARD_TEAM_URL:-https://raw.githack.com/Kosid-B/pole/lantak-public/public/lantak-team-loader.html}
      NEXT_PUBLIC_DRYING_YARD_ADMIN_URL: ${NEXT_PUBLIC_DRYING_YARD_ADMIN_URL:-https://raw.githack.com/Kosid-B/pole/admin-public/public/lantak-admin.html}
    volumes:
      - sitecost_data:/app/data
    restart: unless-stopped

volumes:
  sitecost_data:
