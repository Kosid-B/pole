<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Admin • รับรองการจอง</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#d8e2ef;--nav:#0f172a;--acc:#0f766e;--blue:#2563eb;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}button,input{font:inherit}.app{max-width:900px;margin:auto;padding:12px}.hero{background:var(--nav);color:#fff;border-radius:20px;padding:16px}.hero h1{margin:0;font-size:20px}.hero p,.small{font-size:10px;color:var(--mut);line-height:1.5}.hero p{color:#cbd5e1;margin:4px 0 0}.login{max-width:440px;margin:12vh auto 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.hidden{display:none!important}input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;padding:8px 9px;font-size:16px}.primary,.secondary,.reject{border:0;border-radius:10px;min-height:40px;padding:8px 10px;font-weight:700}.primary{background:var(--acc);color:#fff}.secondary{background:#edf2f7}.reject{background:#fee2e2;color:#b91c1c}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.kpi,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.kpi b{display:block;font-size:20px}.kpi span,.meta{font-size:10px;color:var(--mut)}.section{margin-top:14px}.section h2{font-size:17px;margin:0 0 7px}.list{display:flex;flex-direction:column;gap:8px}.top{display:flex;justify-content:space-between;gap:8px}.price{font-size:15px;font-weight:800;color:var(--acc)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.rate{display:grid;grid-template-columns:70px 1fr 1fr 1fr auto;gap:7px;align-items:end}.rate label span{display:block;font-size:9px;color:var(--mut)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);opacity:0;background:#0f172a;color:#fff;border-radius:10px;padding:8px 11px;font-size:10px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:650px){.rate{grid-template-columns:1fr 1fr}.rate>b,.rate>button{grid-column:1/-1}}
</style></head><body>
<div id="loginView" class="login"><h1>Admin • รับรองการจอง</h1><p class="small">ใช้ Admin Access Code</p><input id="codeInput" type="password" placeholder="ADMIN-XXXXXXXXXX"><button id="loginBtn" class="primary" style="width:100%;margin-top:9px">เข้าสู่ระบบ</button><div id="loginMsg" class="small"></div></div>
<main id="appView" class="app hidden"><div class="hero"><h1>Admin Booking Control</h1><p>รับรองการจอง • ป้องกันจองซ้ำ • ปรับค่าติดตั้งทีม</p></div><div class="kpis"><div class="kpi"><b id="kp" style="color:var(--amber)">0</b><span>รอรับรอง</span></div><div class="kpi"><b id="ka" style="color:var(--blue)">0</b><span>อนุมัติแล้ว</span></div><div class="kpi"><b id="kv">0</b><span>มูลค่าจอง</span></div></div>
<section class="section"><div class="top"><h2>คิวรอรับรอง</h2><button id="refreshBtn" class="secondary">รีเฟรช</button></div><div id="pendingList" class="list"></div></section>
<section class="section"><h2>Rate Card ค่าติดตั้ง</h2><p class="small">Total = ค่าลาน + ค่าเสา + Package</p><div id="rateList" class="list"></div></section>
<section class="section"><h2>ประวัติการจอง</h2><div id="historyList" class="list"></div></section></main><div id="toast" class="toast"></div>
<script>
const API="https://erweztmbezbwbjzwjxqt.supabase.co/functions/v1/drying-yard-booking-api";let code="",rows=[],rates=[];const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:0})+" บาท";function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1500)}async function api(action,p={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,action,...p})});const j=await r.json();if(!r.ok)throw new Error(j.error||j.detail||"API_ERROR");return j}async function login(){code=$("codeInput").value.trim();try{const x=await api("login");if(x.role!=="admin")throw 0;localStorage.setItem("sc_admin_code",code);$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");await refresh()}catch(e){$("loginMsg").textContent="Admin Code ไม่ถูกต้อง";code=""}}async function refresh(){const [r,s]=await Promise.all([api("list_reservations"),api("list_sites")]);rows=r.reservations||[];rates=s.rates||[];render()}function render(){const p=rows.filter(x=>x.status==="pending"),a=rows.filter(x=>x.status==="approved");$("kp").textContent=p.length;$("ka").textContent=a.length;$("kv").textContent=money(a.reduce((n,x)=>n+Number(x.installation_fee_total||0),0));$("pendingList").innerHTML=p.map(x=>`<div class="card"><div class="top"><div><b>${x.site_code} • ${x.g}</b><div class="meta">${x.province} • ${x.district}<br>ทีม ${x.team_name} • ${x.requested_install_date||"ไม่ระบุวันที่"}</div></div><div class="price">${money(x.installation_fee_total)}</div></div><div class="actions"><button class="reject" data-id="${x.id}">ปฏิเสธ</button><button class="primary approve" data-id="${x.id}">รับรอง</button></div></div>`).join("")||'<div class="card small">ไม่มีคิวรอรับรอง</div>';document.querySelectorAll(".approve").forEach(b=>b.onclick=()=>decide(b.dataset.id,"approved"));document.querySelectorAll(".reject").forEach(b=>b.onclick=()=>decide(b.dataset.id,"rejected"));$("historyList").innerHTML=rows.slice(0,100).map(x=>`<div class="card"><div class="top"><div><b>${x.site_code} • ${x.team_name}</b><div class="meta">${x.province} • ${x.district} • ${x.status}</div></div><div class="price">${money(x.installation_fee_total)}</div></div></div>`).join("");$("rateList").innerHTML=rates.map((x,i)=>`<div class="card rate"><b>${x.installation_type} • ${x.area_m2}</b><label><span>ค่าลาน</span><input class="yard" value="${x.yard_install_fee}" type="number"></label><label><span>ค่าเสา</span><input class="pole" value="${x.pole_install_fee}" type="number"></label><label><span>Package</span><input class="pkg" value="${x.package_install_fee}" type="number"></label><button class="primary save" data-i="${i}">บันทึก</button></div>`).join("");document.querySelectorAll(".save").forEach(b=>b.onclick=()=>saveRate(Number(b.dataset.i)))}async function decide(id,decision){if(!confirm(decision==="approved"?"รับรองการจองนี้?":"ปฏิเสธการจองนี้?"))return;try{await api("decide",{reservation_id:id,decision});toast(decision==="approved"?"รับรองแล้ว":"ปฏิเสธแล้ว");await refresh()}catch(e){toast(e.message)}}async function saveRate(i){const x=rates[i],c=document.querySelectorAll(".rate")[i];try{await api("update_rate",{g:x.installation_type,area_m2:Number(x.area_m2),yard_install_fee:Number(c.querySelector(".yard").value),pole_install_fee:Number(c.querySelector(".pole").value),package_install_fee:Number(c.querySelector(".pkg").value)});toast("บันทึกแล้ว");await refresh()}catch(e){toast(e.message)}}$("loginBtn").onclick=login;$("refreshBtn").onclick=refresh;const saved=localStorage.getItem("sc_admin_code");if(saved){$("codeInput").value=saved;login()}
</script></body></html>
