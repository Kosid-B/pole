name: Vercel Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY_PRODUCTION to authorize canonical SiteCost production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sitecost-vercel-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: windows-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_oryw9VGF4TLakA4qBU6pGx43
      VERCEL_PROJECT_ID: prj_LdSJHSRZrV1G3RORdcNMpjvkkBGr
      VERCEL_CLI_VERSION: 59.11.2
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CANONICAL_PRODUCTION_URL: https://sitecost-lantak-os.vercel.app

    steps:
      - name: Validate explicit production authorization
        shell: pwsh
        run: |
          if ("${{ inputs.confirm_production }}" -ne "DEPLOY_PRODUCTION") {
            throw "Production authorization phrase does not match; refusing to deploy."
          }
          if ([string]::IsNullOrWhiteSpace($env:VERCEL_TOKEN)) {
            throw "VERCEL_TOKEN is not configured; refusing to deploy."
          }
          if ($env:VERCEL_ORG_ID -ne "team_oryw9VGF4TLakA4qBU6pGx43") { throw "Unexpected Vercel org ID" }
          if ($env:VERCEL_PROJECT_ID -ne "prj_LdSJHSRZrV1G3RORdcNMpjvkkBGr") { throw "Unexpected Vercel project ID" }

      - name: Checkout authoritative source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push database schema
        run: pnpm db:push

      - name: Seed database
        run: pnpm db:seed

      - name: Run unit and integration tests
        run: pnpm test

      - name: Pull canonical Production settings
        shell: pwsh
        run: pnpm dlx vercel@$env:VERCEL_CLI_VERSION pull --yes --environment=production --token="$env:VERCEL_TOKEN"

      - name: Build Production artifact
        shell: pwsh
        run: pnpm dlx vercel@$env:VERCEL_CLI_VERSION build --prod --token="$env:VERCEL_TOKEN"

      - name: Deploy Production artifact
        id: deploy
        shell: pwsh
        run: |
          $output = pnpm dlx vercel@$env:VERCEL_CLI_VERSION deploy --prebuilt --prod --yes --token="$env:VERCEL_TOKEN" 2>&1 | Tee-Object -Variable deployLog
          $text = ($deployLog | Out-String)
          $matches = [regex]::Matches($text, 'https://[^\s]+\.vercel\.app')
          if ($matches.Count -eq 0) { throw "Production deployment completed without a parseable deployment URL." }
          $deploymentUrl = $matches[$matches.Count - 1].Value
          "url=$deploymentUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          @"
          ## SiteCost Vercel Production

          Source SHA: $env:GITHUB_SHA
          Deployment: $deploymentUrl
          Canonical domain: $env:CANONICAL_PRODUCTION_URL
          Project ID: $env:VERCEL_PROJECT_ID
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Inspect Production deployment
        shell: pwsh
        run: pnpm dlx vercel@$env:VERCEL_CLI_VERSION inspect "${{ steps.deploy.outputs.url }}" --token="$env:VERCEL_TOKEN"

      - name: Verify deployment health endpoint
        shell: pwsh
        run: |
          $healthUrl = "${{ steps.deploy.outputs.url }}/api/health"
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $body = (Invoke-WebRequest -UseBasicParsing -Uri $healthUrl -TimeoutSec 10).Content
              if ($body -match '"ok":true' -and $body -match '"service":"sitecost-project-management-saas"' -and $body -match '"runtime":"nextjs"') {
                Write-Output $body
                exit 0
              }
            } catch {}
            Start-Sleep -Seconds 2
          }
          throw "Production health contract failed: $healthUrl"

      - name: Verify canonical production domain
        shell: pwsh
        run: |
          $healthUrl = "$env:CANONICAL_PRODUCTION_URL/api/health"
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $body = (Invoke-WebRequest -UseBasicParsing -Uri $healthUrl -TimeoutSec 10).Content
              if ($body -match '"ok":true' -and $body -match '"service":"sitecost-project-management-saas"' -and $body -match '"runtime":"nextjs"') {
                Write-Output $body
                exit 0
              }
            } catch {}
            Start-Sleep -Seconds 2
          }
          throw "Canonical production domain health contract failed: $healthUrl"
