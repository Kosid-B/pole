name: Vercel Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY_PRODUCTION to authorize canonical SiteCost production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sitecost-vercel-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    environment: production
    env:
      VERCEL_ORG_ID: team_oryw9VGF4TLakA4qBU6pGx43
      VERCEL_PROJECT_ID: prj_LdSJHSRZrV1G3RORdcNMpjvkkBGr
      VERCEL_CLI_VERSION: 59.11.2
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CANONICAL_PRODUCTION_URL: https://sitecost-lantak-os.vercel.app

    steps:
      - name: Validate explicit production authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_production }}" != "DEPLOY_PRODUCTION" ]; then
            echo "Production authorization phrase does not match; refusing to deploy."
            exit 1
          fi
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is not configured; refusing to deploy."
            exit 1
          fi
          test "$VERCEL_ORG_ID" = "team_oryw9VGF4TLakA4qBU6pGx43"
          test "$VERCEL_PROJECT_ID" = "prj_LdSJHSRZrV1G3RORdcNMpjvkkBGr"

      - name: Checkout authoritative source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run unit and integration tests
        run: pnpm test

      - name: Pull canonical Production settings
        shell: bash
        run: |
          pnpm dlx vercel@${VERCEL_CLI_VERSION} pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build Production artifact
        shell: bash
        run: |
          pnpm dlx vercel@${VERCEL_CLI_VERSION} build \
            --prod \
            --token="$VERCEL_TOKEN"

      - name: Deploy Production artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy \
            --prebuilt \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN" \
            2>&1 | tee /tmp/vercel-production.log

          DEPLOYMENT_URL="$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-production.log | tail -n 1)"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Production deployment completed without a parseable deployment URL."
            exit 1
          fi

          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          {
            echo "## SiteCost Vercel Production"
            echo
            echo "Source SHA: $GITHUB_SHA"
            echo "Deployment: $DEPLOYMENT_URL"
            echo "Canonical domain: $CANONICAL_PRODUCTION_URL"
            echo "Project ID: $VERCEL_PROJECT_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect Production deployment
        shell: bash
        run: |
          pnpm dlx vercel@${VERCEL_CLI_VERSION} inspect \
            "${{ steps.deploy.outputs.url }}" \
            --token="$VERCEL_TOKEN"

      - name: Verify deployment health endpoint
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="${{ steps.deploy.outputs.url }}/api/health"
          for attempt in {1..30}; do
            BODY="$(curl --fail --silent --show-error "$HEALTH_URL" || true)"
            if printf '%s' "$BODY" | grep -q '"ok":true' \
              && printf '%s' "$BODY" | grep -q '"service":"sitecost-project-management-saas"' \
              && printf '%s' "$BODY" | grep -q '"runtime":"nextjs"'; then
              echo "$BODY"
              exit 0
            fi
            sleep 2
          done
          echo "Production health contract failed: $HEALTH_URL"
          exit 1

      - name: Verify canonical production domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            BODY="$(curl --fail --silent --show-error "$CANONICAL_PRODUCTION_URL/api/health" || true)"
            if printf '%s' "$BODY" | grep -q '"ok":true' \
              && printf '%s' "$BODY" | grep -q '"service":"sitecost-project-management-saas"' \
              && printf '%s' "$BODY" | grep -q '"runtime":"nextjs"'; then
              echo "$BODY"
              exit 0
            fi
            sleep 2
          done
          echo "Canonical production domain health contract failed: $CANONICAL_PRODUCTION_URL/api/health"
          exit 1
