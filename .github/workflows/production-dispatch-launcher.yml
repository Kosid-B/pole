name: One-shot Production Dispatch Launcher

# One-shot launcher for Kalasin GM readiness release. Delete after successful canonical deployment.
on:
  push:
    branches:
      - codex/project-management-saas-mvp
    paths:
      - .github/workflows/production-dispatch-launcher.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-production:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch canonical SiteCost production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/vercel-production.yml/dispatches" \
            -d "{\"ref\":\"${REF}\",\"inputs\":{\"confirm_production\":\"DEPLOY_PRODUCTION\"}}"
          echo "Dispatched vercel-production.yml on ${REF}."
